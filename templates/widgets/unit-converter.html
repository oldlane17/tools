<div class="tool-options-grid">
  <div>
    <label for="unit-category" class="tool-label">Measurement Type:</label>
    <select id="unit-category" class="tool-select">
      <option value="length" selected>Length & Distance</option>
      <option value="mass">Mass & Weight</option>
      <option value="temperature">Temperature</option>
      <option value="digital">Digital Storage & Data</option>
      <option value="speed">Speed & Velocity</option>
      <option value="area">Area & Land</option>
    </select>
  </div>
  <div>
    <label for="unit-precision" class="tool-label">Decimal Precision:</label>
    <select id="unit-precision" class="tool-select">
      <option value="2">2 Decimals</option>
      <option value="4" selected>4 Decimals</option>
      <option value="6">6 Decimals</option>
      <option value="8">8 Decimals</option>
    </select>
  </div>
</div>

<div style="display:grid;grid-template-columns:1fr auto 1fr;gap:var(--space-md);align-items:center;margin:var(--space-lg) 0;">
  <div>
    <label for="unit-from-val" class="tool-label">From:</label>
    <input type="number" id="unit-from-val" class="tool-input" value="10" placeholder="Value">
    <select id="unit-from" class="tool-select" style="margin-top:var(--space-xs);"></select>
  </div>

  <div style="display:flex;justify-content:center;padding-top:1.5rem;">
    <button type="button" id="btn-unit-swap" class="btn btn-secondary" title="Swap From and To units" style="padding:0.6rem 0.8rem;">⇄</button>
  </div>

  <div>
    <label for="unit-to-val" class="tool-label">To:</label>
    <input type="text" id="unit-to-val" class="tool-input" readonly placeholder="Result">
    <select id="unit-to" class="tool-select" style="margin-top:var(--space-xs);"></select>
  </div>
</div>

<div id="unit-formula" style="font-size:0.9rem;color:var(--accent);font-family:var(--font-mono);margin-top:var(--space-sm);"></div>
<div id="unit-status" class="tool-status-message" aria-live="polite"></div>
